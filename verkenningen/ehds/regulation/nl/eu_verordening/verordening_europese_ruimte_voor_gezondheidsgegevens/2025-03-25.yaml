              url: http://data.europa.eu/eli/reg/2025/327/oj
              explanation: >-
                [art2-lid2-onderdeel-b] «andere elektronische gezondheidsgegevens dan persoonlijke elektronische
                gezondheidsgegevens, met inbegrip van zowel gegevens die geanonimiseerd zijn zodat zij niet langer
                betrekking hebben op een geïdentificeerde of identificeerbare natuurlijke persoon (de “betrokkene”)
                als gegevens die nooit betrekking hebben gehad op een betrokkene»
        output:
          - name: partij_uit_opsomming_punt_t
            type: boolean
            description: >-
              De partij valt onder een van de opgesomde partijen in art. 2, lid 2, punt t), anders dan de
