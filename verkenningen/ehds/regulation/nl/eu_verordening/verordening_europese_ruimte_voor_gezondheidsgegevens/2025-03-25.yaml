                - $is_vergoedingsdienst_waar_noodzakelijk
                - $ontwikkelt_producten_of_diensten_voor_gezondheidssector
                - $ontwikkelt_of_vervaardigt_wellnessapps
                - $verricht_onderzoek_gezondheidszorg_of_zorgsector
                - $treedt_op_als_sterfteregister
            legal_basis:
