# CONCEPT — te valideren door een jurist. Dit regelwerk stelt de juridische uitleg niet vast.
#
# Verkenning: valt een databron onder de plicht om elektronische gezondheidsgegevens beschikbaar te
# stellen voor secundair gebruik (Verordening (EU) 2025/327, EHDS), onder welke categorie(ën) van
# art. 51, en vanaf welke datum? De engine combineert alleen antwoorden op de parameters volgens de
# structuur van de tekst; elk menselijk oordeel is een parameter met `required: false`, zodat een
# onbeantwoorde vraag tot een onbekende uitkomst leidt in plaats van tot een stilzwijgende keuze.
#
# Elke `legal_basis.explanation` begint met de inventaris-ID('s) tussen [ ] en citeert de brontekst
# letterlijk tussen « »; `scripts/valideer.py` controleert beide tegen `inventaris.json`.
# Gaten in het formaat: zie README.md in de werkmap.
#
# Bestandsplek: de BDD-loader leest alleen `<REGULATION_PATH>/nl/`, daarom staat deze EU-verordening
# onder `regulation/nl/eu_verordening/`.
#
# valid_from: art. 105, eerste alinea (twintigste dag na bekendmaking; bekendmaking PB L van 5 maart
# 2025 volgens de Formex-metadata) — berekend, zie interpretatielogboek.
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/tags/schema-v0.7.1/schema/v0.7.1/schema.json
$id: verordening_europese_ruimte_voor_gezondheidsgegevens
regulatory_layer: EU_VERORDENING
publication_date: '2025-03-05'
valid_from: '2025-03-25'
celex_nummer: 32025R0327
eli: http://data.europa.eu/eli/reg/2025/327/oj
url: http://data.europa.eu/eli/reg/2025/327/oj
name: >-
  Verordening (EU) 2025/327 van het Europees Parlement en de Raad van 11 februari 2025 betreffende de Europese
  ruimte voor gezondheidsgegevens en tot wijziging van Richtlijn 2011/24/EU en Verordening (EU) 2024/2847
articles:
  - number: '1'
    text: |-
      1. Bij deze verordening wordt de Europese ruimte voor gezondheidsgegevens (European Health Data Space — EHDS)
      vastgesteld door te voorzien in gemeenschappelijke regels, normen en infrastructuren en een governancekader,
      teneinde de toegang tot elektronische gezondheidsgegevens te vergemakkelijken met het oog op het primaire
      gebruik van elektronische gezondheidsgegevens en secundaire gebruik van die gegevens.

      2. Deze verordening:

      a) specificeert de in Verordening (EU) 2016/679 vastgestelde rechten van natuurlijke personen met betrekking
      tot het primaire gebruik en secundaire gebruik van hen betreffende persoonlijke elektronische
      gezondheidsgegevens en vult die rechten aan;

      b) bevat gemeenschappelijke voorschriften voor systemen voor elektronische patiëntendossiers (“EPD-systemen”)
      met betrekking tot twee verplichte geharmoniseerde softwarecomponenten, namelijk de “Europese
      interoperabiliteitssoftwarecomponent voor EPD-systemen” en de “Europese logsoftwarecomponent voor
      EPD-systemen” zoals gedefinieerd in artikel 2, lid 2, punt n), respectievelijk punt o), en voor wellnessapps
      waarvan wordt geclaimd dat zij interoperabel zijn met EPD-systemen met betrekking tot die twee geharmoniseerde
      softwarecomponenten, wat primair gebruik van elektronische gezondheidsgegevens betreft;

      c) stelt gemeenschappelijke regels en mechanismen vast voor het primaire gebruik van elektronische
      gezondheidsgegevens en het secundaire gebruik van elektronische gezondheidsgegevens;

      d) brengt een grensoverschrijdende infrastructuur tot stand die het primaire gebruik van persoonlijke
      elektronische gezondheidsgegevens in de hele Unie mogelijk maakt;

      e) brengt een grensoverschrijdende infrastructuur tot stand voor het secundaire gebruik van elektronische
      gezondheidsgegevens;

      f) stelt governance- en coördinatiemechanismen vast op Unie- en nationaal niveau voor zowel het primaire
      gebruik van elektronische gezondheidsgegevens als het secundaire gebruik van elektronische
      gezondheidsgegevens.

      3. Deze verordening doet geen afbreuk aan andere rechtshandelingen van de Unie betreffende de toegang tot, en
      het delen van of het secundaire gebruik van, elektronische gezondheidsgegevens, noch aan vereisten van de Unie
      voor de verwerking van gegevens in verband met elektronische gezondheidsgegevens, met name Verordeningen (EG)
      nr. 223/2009, (EU) nr. 536/2014, (EU) 2016/679, (EU) 2018/1725, (EU) 2022/868 en (EU) 2023/2854 van het
      Europees Parlement en d Raad, en Richtlijnen 2002/58/EG en (EU) 2016/943 van het Europees Parlement en de
      Raad.

      4. Verwijzingen in deze verordening naar de bepalingen van Verordening (EU) 2016/679 worden in voorkomend
      geval ook gelezen als verwijzingen naar de overeenkomstige bepalingen van Verordening (EU) 2018/1725, wat de
      instellingen, organen en instanties van de Unie betreft.

      5. Deze verordening doet geen afbreuk aan de Verordeningen (EU) 2017/745, (EU) 2017/746 en (EU) 2024/1689 wat
      betreft de veiligheid van medische hulpmiddelen, medische hulpmiddelen voor in-vitrodiagnostiek en systemen
      met artificiële intelligentie (AI) die interageren met EPD-systemen.

      6. Deze verordening doet geen afbreuk aan het Unierecht of het nationale recht inzake de elektronische
      verwerking van gezondheidsgegevens met het oog op rapportage, het voldoen aan verzoeken om toegang tot
      informatie of het aantonen of verifiëren van de naleving van wettelijke verplichtingen, of aan het Unierecht
      of het nationale recht wat betreft het verlenen van toegang tot en de openbaarmaking van officiële documenten.

      7. Deze verordening doet geen afbreuk aan specifieke bepalingen in het Unierecht of het nationale recht die
      voorzien in toegang tot elektronische gezondheidsgegevens voor verdere verwerking door openbare lichamen van
      de lidstaten, door instellingen, organen en instanties van de Unie, of door particuliere entiteiten waaraan
      krachtens het Unierecht of het nationale recht een taak van algemeen belang is toevertrouwd, met het oog op de
      uitvoering van die taak.

      8. Deze verordening doet geen afbreuk aan de toegang tot elektronische gezondheidsgegevens voor secundair
      gebruik dat is overeengekomen in het kader van contractuele of administratieve regelingen tussen publieke of
      particuliere entiteiten.

      9. Deze verordening is niet van toepassing op de verwerking van persoonsgegevens in de volgende gevallen:

      a) wanneer de verwerking wordt uitgevoerd in het kader van activiteiten die buiten de werkingssfeer van het
      Unierecht vallen;

      b) wanneer de verwerking wordt uitgevoerd door bevoegde autoriteiten met het oog op de voorkoming, het
      onderzoek, de opsporing en de vervolging van strafbare feiten of de tenuitvoerlegging van straffen, met
      inbegrip van de bescherming tegen en de voorkoming van gevaren voor de openbare veiligheid.
    url: http://data.europa.eu/eli/reg/2025/327/oj
