            value:
              operation: OR
              conditions:
                - $voldoet_aan_punt_t_i
                - $kan_niet_persoonsgebonden_gegevens_beschikbaar_stellen_via_ontwerp
            legal_basis:
              law: Verordening (EU) 2025/327
              article: '2'
              paragraph: '2'
              url: http://data.europa.eu/eli/reg/2025/327/oj
              explanation: >-
                [art2-lid2-onderdeel-t-i, art2-lid2-onderdeel-t-ii] «ofwel»
          - output: is_houder_van_gezondheidsgegevens
            value:
              operation: OR
              conditions:
