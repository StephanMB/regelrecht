  - number: '105'
    text: |-
      Deze verordening treedt in werking op de twintigste dag na die van de bekendmaking ervan in het Publicatieblad
      van de Europese Unie.

      Deze verordening is van toepassing met ingang van 26 maart 2027.

      De artikelen 3 tot en met 15, artikel 23, leden 2 tot en met 6, en de artikelen 25, 26, 27, 47, 48 en 49 zijn
      evenwel als volgt van toepassing:

      a) met ingang van 26 maart 2029 op de in artikel 14, lid 1, punten a), b) en c), bedoelde prioritaire
      categorieën persoonlijke elektronische gezondheidsgegevens en op EPD-systemen die door de fabrikant zijn
      bedoeld om gegevens uit die categorieën te verwerken;

      b) met ingang van 26 maart 2031 op de in artikel 14, lid 1, punten d), e) en f), bedoelde prioritaire
      categorieën persoonlijke elektronische gezondheidsgegevens en op EPD-systemen die door de fabrikant zijn
      bedoeld om gegevens uit die categorieën te verwerken;

      c) met ingang van één jaar vanaf de datum zoals vastgelegd in een op grond van artikel 14, lid 2, vast te
      stellen gedelegeerde handeling voor elke wijziging van de belangrijkste kenmerken van de in bijlage I
      opgenomen persoonlijke elektronische gezondheidsgegevens, mits die datum na de in de punten a) en b) van deze
      alinea bedoelde toepassingsdatum valt voor de betrokken categorieën persoonlijke elektronische
      gezondheidsgegevens.

      Hoofdstuk III is met ingang van 26 maart 2031 van toepassing op de in artikel 26, lid 2, bedoelde EPD-systemen
      die in de Unie in gebruik zijn genomen.

      Hoofdstuk IV is met ingang van 26 maart 2029 van toepassing. Evenwel zijn artikel 55, lid 6, artikel 70,
      artikel 73, lid 5, artikel 75, leden 1 en 12, artikel 77, lid 4, en artikel 78, lid 6, van toepassing met
      ingang van 26 maart 2027, is artikel 51, lid 1, punten b), f), g), m) en p), van toepassing met ingang van 26
      maart 2031, en is artikel 75, lid 5, van toepassing met ingang van 26 maart 2035.

      De in artikel 13, lid 4, artikel 15, lid 1, artikel 23, lid 4, en artikel 36, lid 1, bedoelde
      uitvoeringshandelingen zijn van toepassing met ingang van de in de derde alinea van dit artikel bedoelde data,
      afhankelijk van de categorieën persoonlijke elektronische gezondheidsgegevens bedoeld in artikel 14, lid 1,
      punten a), b) en c), respectievelijk artikel 14, lid 1, punten d), e) en f).

      De in artikel 70, artikel 73, lid 5, artikel 75, lid 12, artikel 77, lid 4, en artikel 78, lid 6, bedoelde
      uitvoeringshandelingen zijn met ingang van 26 maart 2029 van toepassing.
