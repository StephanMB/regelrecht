                toegang tot gezondheidsgegevens»
  - number: '60'
    text: |-
      1. De houders van gezondheidsgegevens stellen de in artikel 51 bedoelde relevante elektronische
      gezondheidsgegevens op verzoek beschikbaar aan de instantie voor toegang tot gezondheidsgegevens
      overeenkomstig een gegevensvergunning die is afgegeven op grond van artikel 68 of naar aanleiding van een
      verzoek om gegevens dat is goedgekeurd op grond van artikel 69.

      2. De houders van gezondheidsgegevens stellen de gevraagde elektronische gezondheidsgegevens als bedoeld in
      lid 1 ter beschikking van de instantie voor toegang tot gezondheidsgegevens binnen een redelijke termijn en
      uiterlijk binnen drie maanden na ontvangst van het verzoek van de instantie voor toegang tot
      gezondheidsgegevens. In gerechtvaardigde gevallen kan de instantie voor toegang tot gezondheidsgegevens die
      termijn met maximaal drie maanden verlengen.

      3. De houders van gezondheidsgegevens verstrekken de instantie voor toegang tot gezondheidsgegevens een
      beschrijving van de dataset waarover zij beschikken overeenkomstig artikel 77. De houders van
      gezondheidsgegevens controleren ten minste elk jaar of de beschrijving van de dataset in de nationale
      catalogus van datasets nauwkeurig en actueel is.

      4. Wanneer de dataset overeenkomstig artikel 78 vergezeld gaat van een gegevenskwaliteits- en
      gegevensbruikbaarheidslabel, verstrekken de houders van gezondheidsgegevens de instantie voor toegang tot
      gezondheidsgegevens voldoende documentatie om de juistheid van het label te verifiëren.

      5. De houders van niet-persoonsgebonden elektronische gezondheidsgegevens zorgen voor toegang tot gegevens via
      betrouwbare open databanken om onbeperkte toegang voor alle gebruikers en de opslag en bewaring van gegevens
      te waarborgen. Betrouwbare open openbare databanken moeten beschikken over een robuust, transparant en
      duurzaam bestuur en een transparant model voor gebruikerstoegang.
    url: http://data.europa.eu/eli/reg/2025/327/oj
