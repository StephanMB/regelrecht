            description: >-
              De partij is houder van gezondheidsgegevens (art. 2, lid 2, punt t)). Onbekend zolang de leesvraag
              over punt t) open is en de twee lezingen voor deze partij verschillen.
          - name: bevat_persoonlijke_elektronische_gezondheidsgegevens
