                [art2-lid2-onderdeel-a] «“persoonlijke elektronische gezondheidsgegevens”»
          - output: bevat_elektronische_gezondheidsgegevens
            value:
              operation: OR
              conditions:
                - $bevat_persoonlijke_elektronische_gezondheidsgegevens
                - $bevat_niet_persoonsgebonden_elektronische_gezondheidsgegevens
            legal_basis:
              law: Verordening (EU) 2025/327
              article: '2'
              paragraph: '2'
              url: http://data.europa.eu/eli/reg/2025/327/oj
              explanation: >-
                [art2-lid2-onderdeel-c] «persoonlijke of niet-persoonsgebonden elektronische gezondheidsgegevens»
  - number: '50'
    text: |-
      1. De volgende categorieën houders van gezondheidsgegevens worden vrijgesteld van de in dit hoofdstuk
      vastgelegde verplichtingen voor houders van gezondheidsgegevens:

      a) natuurlijke personen, met inbegrip van individuele onderzoekers;

      b) rechtspersonen die een micro-onderneming zijn zoals gedefinieerd in artikel 2, lid 3, van de bijlage bij
      Aanbeveling 2003/361/EG van de Commissie.

      2. De lidstaten kunnen in hun nationale recht echter bepalen dat de in dit hoofdstuk vastgelegde
      verplichtingen voor houders van gezondheidsgegevens van toepassing zijn op de in lid 1 bedoelde houders van
      gezondheidsgegevens die onder hun jurisdictie vallen.

      3. De lidstaten kunnen in hun nationale recht bepalen dat de verplichtingen van bepaalde categorieën houders
      van gezondheidsgegevens moeten worden vervuld door bemiddelingsentiteiten voor gezondheidsgegevens. In dat
      geval worden de gegevens niettemin beschouwd als beschikbaar gesteld door meerdere houders van
      gezondheidsgegevens.

      4. De lidstaten stellen de Commissie uiterlijk op 26 maart 2029 in kennis van het in de leden 2 en 3 bedoelde
      nationale recht. Eventueel later vastgesteld recht of wijzigingen van dat recht worden onverwijld aan de
      Commissie meegedeeld.
    url: http://data.europa.eu/eli/reg/2025/327/oj
    machine_readable:
      execution:
        parameters:
          - name: houder_is_natuurlijke_persoon
            type: boolean
            required: false
            description: >-
              Is de houder een natuurlijke persoon (met inbegrip van een individuele onderzoeker)?
            legal_basis:
              law: Verordening (EU) 2025/327
              article: '50'
              paragraph: '1'
              url: http://data.europa.eu/eli/reg/2025/327/oj
              explanation: >-
                [art50-lid1, art50-lid1-onderdeel-a] «natuurlijke personen, met inbegrip van individuele
                onderzoekers;»
          - name: houder_is_micro_onderneming
            type: boolean
            required: false
            description: >-
              Is de houder een rechtspersoon die een micro-onderneming is zoals gedefinieerd in artikel 2, lid 3,
              van de bijlage bij Aanbeveling 2003/361/EG van de Commissie?
            legal_basis:
              law: Verordening (EU) 2025/327
              article: '50'
              paragraph: '1'
              url: http://data.europa.eu/eli/reg/2025/327/oj
              explanation: >-
                [art50-lid1, art50-lid1-onderdeel-b] «rechtspersonen die een micro-onderneming zijn zoals
                gedefinieerd in artikel 2, lid 3, van de bijlage bij Aanbeveling 2003/361/EG van de Commissie.»
          - name: nationaal_recht_past_plichten_toe_op_vrijgestelde_houder
            type: boolean
            required: false
            description: >-
              Bepaalt het nationale recht van de lidstaat onder wiens jurisdictie de houder valt dat de
              verplichtingen van hoofdstuk IV toch op deze (natuurlijke persoon of micro-onderneming) van
              toepassing zijn?
            legal_basis:
              law: Verordening (EU) 2025/327
              article: '50'
              paragraph: '2'
              url: http://data.europa.eu/eli/reg/2025/327/oj
              explanation: >-
                [art50-lid2] «De lidstaten kunnen in hun nationale recht echter bepalen»
          - name: nationaal_recht_wijst_bemiddelingsentiteit_aan
            type: boolean
            required: false
            description: >-
              Bepaalt het nationale recht dat de verplichtingen van de categorie houders waartoe deze houder
              behoort, moeten worden vervuld door een bemiddelingsentiteit voor gezondheidsgegevens?
            legal_basis:
              law: Verordening (EU) 2025/327
              article: '50'
              paragraph: '3'
              url: http://data.europa.eu/eli/reg/2025/327/oj
              explanation: >-
                [art50-lid3] «De lidstaten kunnen in hun nationale recht bepalen dat de verplichtingen van bepaalde
                categorieën houders van gezondheidsgegevens moeten worden vervuld door bemiddelingsentiteiten voor
                gezondheidsgegevens.»
        input:
          - name: is_houder_van_gezondheidsgegevens
            type: boolean
            source:
              output: is_houder_van_gezondheidsgegevens
          - name: verordening_niet_van_toepassing_art1_lid9
            type: boolean
            source:
              output: verordening_niet_van_toepassing_art1_lid9
        output:
          - name: vrijgesteld_volgens_lid1
            type: boolean
            description: >-
              De houder valt in een vrijgestelde categorie van art. 50, lid 1.
          - name: vrijstelling_geldt
            type: boolean
            description: >-
              De vrijstelling van lid 1 geldt, ook na lid 2.
          - name: heeft_plichten_als_houder
            type: boolean
            description: >-
              De partij is houder van gezondheidsgegevens, is niet vrijgesteld, en de verordening is niet op grond
              van art. 1, lid 9, buiten toepassing.
          - name: plichten_vervuld_door_bemiddelingsentiteit
            type: boolean
            description: >-
              De plichten van deze houder worden op grond van nationaal recht door een bemiddelingsentiteit
              vervuld (art. 50, lid 3).
        actions:
          - output: vrijgesteld_volgens_lid1
            value:
              operation: OR
              conditions:
                - $houder_is_natuurlijke_persoon
                - $houder_is_micro_onderneming
            legal_basis:
              law: Verordening (EU) 2025/327
              article: '50'
              paragraph: '1'
              url: http://data.europa.eu/eli/reg/2025/327/oj
              explanation: >-
                [art50-lid1] «De volgende categorieën houders van gezondheidsgegevens worden vrijgesteld»
          - output: vrijstelling_geldt
            value:
              operation: AND
              conditions:
                - $vrijgesteld_volgens_lid1
                - operation: NOT
                  value: $nationaal_recht_past_plichten_toe_op_vrijgestelde_houder
            legal_basis:
              law: Verordening (EU) 2025/327
              article: '50'
              paragraph: '1'
              url: http://data.europa.eu/eli/reg/2025/327/oj
              explanation: >-
                [art50-lid1, art50-lid2] «worden vrijgesteld» «echter»
          - output: heeft_plichten_als_houder
            value:
              operation: AND
              conditions:
                - $is_houder_van_gezondheidsgegevens
                - operation: NOT
                  value: $vrijstelling_geldt
                - operation: NOT
                  value: $verordening_niet_van_toepassing_art1_lid9
            legal_basis:
              law: Verordening (EU) 2025/327
              article: '50'
              paragraph: '1'
              url: http://data.europa.eu/eli/reg/2025/327/oj
              explanation: >-
                [art50-lid1, art1-lid9] «vrijgesteld van de in dit hoofdstuk vastgelegde verplichtingen voor houders
                van gezondheidsgegevens»
          - output: plichten_vervuld_door_bemiddelingsentiteit
            value:
              operation: AND
              conditions:
                - $heeft_plichten_als_houder
                - $nationaal_recht_wijst_bemiddelingsentiteit_aan
            legal_basis:
              law: Verordening (EU) 2025/327
              article: '50'
              paragraph: '3'
              url: http://data.europa.eu/eli/reg/2025/327/oj
              explanation: >-
                [art50-lid3] «In dat geval worden de gegevens niettemin beschouwd als beschikbaar gesteld door
                meerdere houders van gezondheidsgegevens.»
  - number: '51'
    text: |-
      1. Houders van gezondheidsgegevens stellen de volgende categorieën elektronische gezondheidsgegevens
      beschikbaar voor secundair gebruik overeenkomstig dit hoofdstuk:

      a) elektronische gezondheidsgegevens afkomstig van EPD’s;

      b) gegevens over factoren die van invloed zijn op de gezondheid, met inbegrip van sociaal-economische, milieu-
      en gedragsdeterminanten van gezondheid;

      c) geaggregeerde gegevens over behoeften op het gebied van gezondheidszorg, de aan gezondheidszorg toegewezen
      middelen, de verstrekking van en toegang tot gezondheidszorg, uitgaven voor gezondheidszorg en financiering
      van gezondheidszorg;

      d) gegevens over pathogenen die van invloed zijn op de menselijke gezondheid;

      e) administratieve gegevens op het gebied van gezondheidszorg, onder meer over verstrekkingen, claims inzake
      vergoedingen en vergoedingen;

      f) humaan-genetische, epigenomische en genomische gegevens;

      g) andere humaan-moleculaire gegevens, zoals proteomische, transcriptomische, metabolomische, lipidomische en
      andere “-omische” gegevens;

      h) via medische hulpmiddelen automatisch gegenereerde persoonlijke elektronische gezondheidsgegevens;

      i) gegevens afkomstig van wellnessapps;

      j) gegevens met betrekking tot de beroepsstatus, en met betrekking tot de specialisatie en instelling van
      gezondheidswerkers die betrokken zijn bij de behandeling van een natuurlijke persoon;

      k) gegevens uit registers van gezondheidsgegevens op bevolkingsniveau zoals volksgezondheidsregisters;

      l) gegevens afkomstig van medische registers en registers over sterfte;

      m) gegevens afkomstig van klinische proeven, klinische studies, klinische onderzoeken en prestatiestudies
      waarop Verordening (EU) nr. 536/2014, Verordening (EU) 2024/1938 van het Europees Parlement en de Raad,
      Verordening (EU) 2017/745 en Verordening (EU) 2017/746 van toepassing zijn;

      n) overige gezondheidsgegevens afkomstig van medische hulpmiddelen;

      o) gegevens afkomstig van registers voor geneesmiddelen en medische hulpmiddelen;

      p) gegevens afkomstig van onderzoekscohorten, vragenlijsten en enquêtes in verband met gezondheid, zodra de
      daarmee verband houdende resultaten gepubliceerd zijn;

      q) gezondheidsgegevens afkomstig van biobanken en bijbehorende databanken.

      2. De lidstaten kunnen in hun nationale recht bepalen dat aanvullende categorieën van elektronische
      gezondheidsgegevens op grond van deze verordening beschikbaar moeten worden gesteld voor secundair gebruik.

      3. De lidstaten kunnen regels vaststellen voor de verwerking en het gebruik van elektronische
      gezondheidsgegevens die verbeteringen bevatten in verband met de verwerking van die gegevens, zoals correctie,
      annotatie of verrijking, op basis van een gegevensvergunning uit hoofde van artikel 68.

      4. De lidstaten kunnen strengere maatregelen en aanvullende waarborgen op nationaal niveau invoeren om de
      gevoeligheid en waarde van de gegevens die onder lid 1, punten f), g), i) en q), vallen te waarborgen. De
      lidstaten stellen de Commissie in kennis van die maatregelen en waarborgen en delen haar onverwijld alle
      latere wijzigingen daarvan mee.
